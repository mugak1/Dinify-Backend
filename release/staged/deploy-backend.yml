# STAGED — NOT ACTIVE. D08 B3: the replacement for .github/workflows/deploy-uat.yml.
#
# This file lives OUTSIDE .github/workflows/ on purpose: merging it activates nothing. GitHub
# runs only workflows under .github/workflows/, and a test (release/tests_staged.py) fails the
# build if a copy of this file, or anything that dispatches the host transition, appears there
# while deploy-uat.yml still exists. The cutover (release/CUTOVER.md) moves it in and DELETES
# deploy-uat.yml in the same reviewed change, so there is never a second active writer.
#
# WHAT IT DOES, in order, and which job holds which authority:
#
#   receive  (contents: read, actions: read — NO id-token)
#     Reads the facts for the triggering PREFLIGHT run from the GitHub API with the trusted
#     verifier (this workflow's own revision, never the target), and runs the B2.6 RECEIVING
#     check: the certification re-derived, the candidate and the preflight result admitted
#     by the listing's digests, the decision reproduced from the raw scanner output under
#     the TRUSTED policy, the deadline ahead by the margin. Writes the admission document.
#     Automatic runs are FORWARD-ONLY: the served identity (both planes' /release/ routes)
#     must be an ancestor of the target, or the run is a clean skip.
#
#   deploy   (id-token: write, contents: read, actions: read; environment uat)
#     Runs NO npm, NO pip, NO scanner, NO candidate code and NO checkout of the target. It
#     repeats the receiving check itself from its own facts BEFORE any credential is
#     requested (the receive job's admission is a hint that must agree byte for byte), then
#     assumes the pinned role, uploads four files to S3 under a per-operation prefix, and
#     dispatches release/staged/host-run.sh through SSM with their sha256s substituted in.
#     The HOST re-derives the admission from the bytes (release/installation.py::admit),
#     installs beside what is serving, gates configuration and migrations, switches both
#     planes, verifies the LOADED processes and restores on failure. The job reads the
#     box's own markers, then reads both planes' identity routes over the public internet.
#
# FIELDS MARKED `UNKNOWN` ARE NOT OBSERVATIONS. The artifact bucket and the role's S3/SSM
# grants for a backend prefix are owner actions recorded in release/CUTOVER.md; the host
# profile (release/profiles/uat-backend.json) is `unverified` and the host refuses it, naming
# every unknown field, until a reviewed discovery run fills it in.
name: "Backend deploy (B3)"

on:
  # A coarse pre-filter only: `workflows` matches a DISPLAY NAME. The receiving check re-reads
  # the preflight run from the API and refuses anything but preflight.yml's own run.
  workflow_run:
    workflows: ["Backend Candidate Preflight"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA on main whose certified candidate to install"
        required: true
        type: string
      preflight_run:
        description: "The Backend Candidate Preflight run whose accepted result admits it"
        required: true
        type: string
      preflight_attempt:
        description: "That run's attempt"
        required: true
        type: string
        default: "1"
      ci_run_id:
        description: "Optional: the certifying Backend CI run, when more than one succeeded for the SHA"
        required: false
        type: string
        default: ""
      mode:
        description: "deploy (forward) or rollback (a deliberate move to an older certified release)"
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions: {}

# ONE writer per host at a time on GitHub's side too. The HOST lock (profile.lockPath, shared
# with Admin — release/HOST_LOCK_CONTRACT.md) is what actually serializes the machine.
concurrency:
  group: dinify-uat-host-backend
  cancel-in-progress: false

env:
  UAT_INSTANCE_ID: i-0eeb7c0c3a36d3667
  AWS_REGION: eu-west-2
  # Pinned here and compared byte for byte with the repository variable before OIDC.
  EXPECTED_ROLE_ARN: arn:aws:iam::767397669083:role/dinify-github-deploy-role
  # UNKNOWN until the owner creates it (release/CUTOVER.md step 3). An empty value refuses.
  ARTIFACT_BUCKET: ${{ vars.BACKEND_ARTIFACT_BUCKET }}

jobs:
  # ════════════════════════════════════════════════════════════════════════════════
  # WINDOW — IS THE DEVELOPMENT SERVER SCHEDULED ON? (CI-signal C3, owner decision of
  # 26 October 2026.) The server and its database run only inside the owner's AWS
  # schedule, so a deploy that starts while they are off used to fail red with nothing
  # broken. This job decides PROCEED, DEFER or FAIL — from evidence first, the clock second:
  #
  #   the target origin answers                 -> PROCEED, whatever the time
  #   no answer, London time outside the window -> DEFER: write a summary, cancel this
  #                                                run (grey), and never exit 0
  #   no answer inside the window               -> FAIL red: that is a real outage
  #
  # It only decides whether the run continues; every later job and gate is unchanged.
  # It holds `actions: write` (to cancel its own run) and nothing else: no id-token, no
  # secret, no checkout, no third-party action and no npm or pip — only workflow shell
  # with curl, date and the preinstalled gh. A run that did not deploy is never green: if
  # the cancellation does not land, this job fails red.
  # ════════════════════════════════════════════════════════════════════════════════
  window:
    name: window
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # The same event gate as `receive`: a preflight that did not succeed skips the whole
    # workflow cleanly rather than probing anything.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      actions: write

    env:
      # THE SERVER'S SCHEDULE, written once. The authority is the owner's AWS schedule for
      # instance i-0eeb7c0c3a36d3667 (Admin and Backend share it): when that schedule
      # moves, update this line, its margin, and the self-test cases below. London wall
      # time — BST in summer, GMT in winter — computed from the system tz database,
      # never a fixed UTC offset. The margin ends the window early, so a silent server in
      # its last 20 minutes is treated as off rather than as an outage.
      DEV_SERVER_WINDOW: "11:00–23:00 Europe/London"
      DEV_SERVER_WINDOW_END_MARGIN_MINUTES: "20"
      # Reachability only. What the answer says is for the existing gates downstream.
      WINDOW_PROBE_URL: https://api-test.dinifyapp.com/uat/api/v1/health/
      WINDOW_DECISION_SH: |
        # window_decide URL WINDOW MARGIN_MINUTES [NOW_EPOCH] [PROBE]
        #
        # Prints ONE line, "<WORD> at <London time>: <reason>", where WORD is PROCEED,
        # DEFER or FAIL, and sets WINDOW_DECISION, WINDOW_AT and WINDOW_REASON.
        # Evidence first, the clock second:
        #   the origin answered (any HTTP status)       -> PROCEED, whatever the time
        #   no answer, London time outside the window   -> DEFER
        #   no answer, London time inside the window    -> FAIL (a real outage)
        # "Inside" is [start, end - margin). NOW_EPOCH and PROBE ("answered" | "silent")
        # are injectable for the self-test; when absent, the clock is read and URL probed.
        # Anything it cannot establish is FAIL, never PROCEED and never DEFER.
        window_decide() {
          local url="${1:-}" window="${2:-}" margin="${3:-}" now="${4:-}" probe="${5:-}"
          local re='^([01][0-9]|2[0-3]):([0-5][0-9])–([01][0-9]|2[0-3]):([0-5][0-9]) ([A-Za-z]+/[A-Za-z_]+)$'
          local start=-1 end=-1 zone="" hm minute
          WINDOW_DECISION=FAIL; WINDOW_AT=unknown; WINDOW_REASON=""
          if [[ "$window" =~ $re ]]; then
            start=$((10#${BASH_REMATCH[1]} * 60 + 10#${BASH_REMATCH[2]}))
            end=$((10#${BASH_REMATCH[3]} * 60 + 10#${BASH_REMATCH[4]}))
            zone="${BASH_REMATCH[5]}"
          fi
          if [ -z "$zone" ]; then
            WINDOW_REASON="the window constant '${window}' is not 'HH:MM–HH:MM Area/City'"
          elif [[ ! "$margin" =~ ^[0-9]{1,3}$ ]]; then
            WINDOW_REASON="the end margin '${margin}' is not a number of minutes"
          else
            end=$((end - 10#${margin}))
            if [ "$start" -ge "$end" ]; then
              WINDOW_REASON="the window '${window}' less ${margin} minutes is empty"
            elif [ ! -f "${TZDIR:-/usr/share/zoneinfo}/${zone}" ]; then
              # An unknown TZ makes date(1) silently fall back to UTC: refuse instead.
              WINDOW_REASON="the time zone '${zone}' is not in the system tz database"
            else
              if [ -z "$now" ]; then now="$(date -u +%s)" || now=""; fi
              if [[ ! "$now" =~ ^[0-9]+$ ]]; then
                WINDOW_REASON="the clock could not be read"
              else
                WINDOW_AT="$(TZ="$zone" date -d "@${now}" '+%Y-%m-%d %H:%M %Z')" || WINDOW_AT=unknown
                hm="$(TZ="$zone" date -d "@${now}" '+%H:%M')" || hm=""
                if [[ ! "$hm" =~ ^([0-9]{2}):([0-9]{2})$ ]]; then
                  WINDOW_AT=unknown
                  WINDOW_REASON="the ${zone} time could not be computed"
                else
                  minute=$((10#${BASH_REMATCH[1]} * 60 + 10#${BASH_REMATCH[2]}))
                  if [ -z "$probe" ]; then probe="$(window_probe "$url")" || probe=""; fi
                  case "$probe" in
                    answered)
                      WINDOW_DECISION=PROCEED
                      WINDOW_REASON="${url} answered" ;;
                    silent)
                      if [ "$minute" -ge "$start" ] && [ "$minute" -lt "$end" ]; then
                        WINDOW_DECISION=FAIL
                        WINDOW_REASON="${url} did not answer inside the scheduled window ${window} (end margin ${margin} min): a real outage"
                      else
                        WINDOW_DECISION=DEFER
                        WINDOW_REASON="${url} did not answer and the server is scheduled off (${window}, end margin ${margin} min)"
                      fi ;;
                    *)
                      WINDOW_REASON="the probe result '${probe}' is neither answered nor silent" ;;
                  esac
                fi
              fi
            fi
          fi
          printf '%s at %s: %s\n' "$WINDOW_DECISION" "$WINDOW_AT" "$WINDOW_REASON"
        }

        # window_probe URL -> "answered" if any HTTP status came back within three
        # attempts, else "silent". Reachability only: what the answer SAYS is for the
        # existing gates downstream, which are unchanged.
        window_probe() {
          local url="$1" code attempt
          for attempt in 1 2 3; do
            code="$(curl -sS -o /dev/null --connect-timeout 10 --max-time 20 -w '%{http_code}' "$url" 2>/dev/null)" || true
            echo "window probe ${attempt}/3: ${url} -> HTTP ${code:-000}" >&2
            if [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then echo answered; return 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo silent
        }

    steps:
      - name: Self-test the window decision
        run: |
          set -euo pipefail
          eval "$WINDOW_DECISION_SH"
          # The cases are written for the window constant and margin above. When the
          # schedule moves, move them with it. Each case is a UTC instant, a probe result,
          # and the expected "<WORD> at <London time>".
          # The daylight-saving days use instants a fixed UTC offset gets wrong.
          FAILED=0
          check() {
            local utc="$1" probe="$2" want="$3" got
            got="$(window_decide "https://self-test.invalid/" "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES" "$(date -u -d "$utc" +%s)" "$probe")"
            if [ "${got%%: *}" = "$want" ]; then
              echo "ok    ${utc} ${probe} -> ${got}"
            else
              echo "FAIL  ${utc} ${probe}: expected '${want}', got '${got}'"; FAILED=1
            fi
          }
          check 2026-10-26T14:00:00Z answered "PROCEED at 2026-10-26 14:00 GMT"   # in window, answering
          check 2026-10-26T14:00:00Z silent   "FAIL at 2026-10-26 14:00 GMT"      # in window, silent: an outage
          check 2026-10-27T03:00:00Z silent   "DEFER at 2026-10-27 03:00 GMT"     # off window, silent
          check 2026-10-27T03:00:00Z answered "PROCEED at 2026-10-27 03:00 GMT"   # off window, answering: evidence wins
          check 2026-10-26T10:59:00Z silent   "DEFER at 2026-10-26 10:59 GMT"     # one minute before the start
          check 2026-10-26T11:00:00Z silent   "FAIL at 2026-10-26 11:00 GMT"      # the start is inside
          check 2026-10-26T22:39:00Z silent   "FAIL at 2026-10-26 22:39 GMT"      # last minute before the margin
          check 2026-10-26T22:40:00Z silent   "DEFER at 2026-10-26 22:40 GMT"     # the 20-minute margin begins
          check 2026-10-26T22:45:00Z silent   "DEFER at 2026-10-26 22:45 GMT"     # inside the margin
          check 2026-10-26T22:45:00Z answered "PROCEED at 2026-10-26 22:45 GMT"   # inside the margin, answering
          check 2026-10-26T23:00:00Z silent   "DEFER at 2026-10-26 23:00 GMT"     # the end is outside
          check 2026-07-15T10:30:00Z silent   "FAIL at 2026-07-15 11:30 BST"      # summer: UTC 10:30 is 11:30 London
          check 2026-07-15T22:30:00Z silent   "DEFER at 2026-07-15 23:30 BST"     # summer: UTC 22:30 is 23:30 London
          # 29 March 2026: clocks go forward at 01:00 UTC.
          check 2026-03-29T00:30:00Z silent   "DEFER at 2026-03-29 00:30 GMT"
          check 2026-03-29T01:30:00Z silent   "DEFER at 2026-03-29 02:30 BST"
          check 2026-03-29T10:30:00Z silent   "FAIL at 2026-03-29 11:30 BST"      # UTC+0 would say 10:30, DEFER
          check 2026-03-29T22:30:00Z silent   "DEFER at 2026-03-29 23:30 BST"     # UTC+0 would say 22:30, FAIL
          # 25 October 2026: clocks go back at 01:00 UTC; 01:30 London happens twice.
          check 2026-10-25T00:30:00Z silent   "DEFER at 2026-10-25 01:30 BST"
          check 2026-10-25T01:30:00Z silent   "DEFER at 2026-10-25 01:30 GMT"
          check 2026-10-25T10:30:00Z silent   "DEFER at 2026-10-25 10:30 GMT"     # UTC+1 would say 11:30, FAIL
          check 2026-10-25T22:30:00Z silent   "FAIL at 2026-10-25 22:30 GMT"      # UTC+1 would say 23:30, DEFER
          check 2026-10-25T22:30:00Z answered "PROCEED at 2026-10-25 22:30 GMT"
          # What it cannot establish is FAIL, never PROCEED or DEFER.
          [[ "$(window_decide u "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES" 1793000000 maybe)" == FAIL* ]] || { echo "FAIL  an unknown probe result must FAIL"; FAILED=1; }
          [[ "$(window_decide u "11:00-23:00 Europe/London" 20 1793000000 silent)" == FAIL* ]] || { echo "FAIL  a malformed window must FAIL"; FAILED=1; }
          [[ "$(window_decide u "11:00–23:00 Nowhere/Atlantis" 20 1793000000 silent)" == FAIL* ]] || { echo "FAIL  an unknown zone must FAIL"; FAILED=1; }
          [[ "$(window_decide u "$DEV_SERVER_WINDOW" x 1793000000 silent)" == FAIL* ]] || { echo "FAIL  a malformed margin must FAIL"; FAILED=1; }
          [[ "$(window_decide u "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES" never silent)" == FAIL* ]] || { echo "FAIL  an unreadable clock must FAIL"; FAILED=1; }
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::The window decision failed its self-test; refusing to decide with it." >&2
            exit 1
          fi
          echo "window self-test: all cases passed"

      - name: Decide PROCEED, DEFER or FAIL
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          eval "$WINDOW_DECISION_SH"
          window_decide "$WINDOW_PROBE_URL" "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES"
          case "$WINDOW_DECISION" in PROCEED|DEFER|FAIL) ;; *) WINDOW_DECISION=FAIL ;; esac
          echo "decision=${WINDOW_DECISION}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TARGET="${INPUT_SHA:-}"; else TARGET="${RUN_SHA:-}"; fi
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || TARGET="(not a full 40-character SHA)"
          case "$WINDOW_DECISION" in
            PROCEED)
              echo "PROCEED: the run continues, and every existing gate still applies." ;;
            DEFER)
              echo "::notice::Backend deploy (B3) deferred: ${WINDOW_REASON} (${WINDOW_AT}). This run cancels itself."
              {
                echo "## Backend deploy (B3): DEFERRED — the development server is scheduled off"
                echo ""
                echo "- Target SHA: \`${TARGET}\`"
                echo "- London time: ${WINDOW_AT}"
                echo "- Evidence: ${WINDOW_REASON}"
                echo ""
                echo "The development server is scheduled off (${DEV_SERVER_WINDOW}). Re-run all jobs at or after ${DEV_SERVER_WINDOW%%–*} London, or dispatch Backend deploy (B3) with sha=${TARGET}. A dispatch also names the accepted preflight run and attempt."
                echo ""
                echo "Nothing was deployed. This run cancels itself, so it shows as cancelled (grey). If it shows red instead, the cancellation did not land; nothing was deployed then either."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            FAIL)
              echo "::error::Backend deploy (B3) stopped before deploying: ${WINDOW_REASON} (${WINDOW_AT})." >&2
              {
                echo "## Backend deploy (B3): FAILED before deploying"
                echo ""
                echo "- Target SHA: \`${TARGET}\`"
                echo "- London time: ${WINDOW_AT}"
                echo "- Evidence: ${WINDOW_REASON}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac

      # The ONLY way out with status 0 is PROCEED. A deferred run cancels itself; the
      # cancellation is asynchronous, so this step then waits for the runner to stop it,
      # and if that has not happened within about two minutes it fails red.
      - name: Enforce the decision (a deferred run cancels itself)
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.decide.outputs.decision }}
        run: |
          set -euo pipefail
          case "${DECISION:-}" in
            PROCEED) exit 0 ;;
            DEFER) ;;
            *) echo "::error::No PROCEED decision (got '${DECISION:-}'). Failing closed." >&2; exit 1 ;;
          esac
          echo "DEFER: cancelling run ${GITHUB_RUN_ID} so it concludes cancelled, never green."
          if ! gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"; then
            echo "::error::The deploy was deferred but the cancellation request failed. Failing red: a run that did not deploy is never green." >&2
            exit 1
          fi
          for i in $(seq 1 24); do
            sleep 5
            STATE="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + "/" + (.conclusion // "")' 2>/dev/null)" || STATE=unreadable
            echo "waiting for the cancellation to land (${i}/24): run ${STATE}"
          done
          echo "::error::The deploy was deferred and its cancellation requested, but the run was not cancelled within about 2 minutes. Failing red: a run that did not deploy is never green." >&2
          exit 1

  receive:
    name: receive
    needs: [window]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A preflight that did not succeed is a SKIPPED deployment, not a red one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      mode: ${{ steps.request.outputs.mode }}
      preflight_run: ${{ steps.request.outputs.preflight_run }}
      preflight_attempt: ${{ steps.request.outputs.preflight_attempt }}
      proceed: ${{ steps.order.outputs.proceed }}
      admission_sha256: ${{ steps.receive.outputs.admission_sha256 }}
    steps:
      - name: Check out the trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            release
            dependency_audit

      - name: Assert the verifier is the workflow revision and holds no credential
        run: |
          if git -C trusted config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::A git credential is persisted in the trusted checkout." >&2; exit 1
          fi
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'

      # Event-derived values reach the shell ONLY through env and are validated here.
      - name: Resolve the request
        id: request
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          IN_SHA: ${{ inputs.sha }}
          IN_RUN: ${{ inputs.preflight_run }}
          IN_ATTEMPT: ${{ inputs.preflight_attempt }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHA="$IN_SHA"; PRUN="$IN_RUN"; PATT="$IN_ATTEMPT"; MODE="$IN_MODE"
          else
            SHA="$RUN_SHA"; PRUN="$RUN_ID"; PATT="$RUN_ATTEMPT"; MODE="deploy"
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::sha is not 40 lowercase hex" >&2; exit 1; }
          printf '%s' "$PRUN" | grep -Eq '^[0-9]{1,20}$' || { echo "::error::preflight run is not numeric" >&2; exit 1; }
          printf '%s' "$PATT" | grep -Eq '^[0-9]{1,4}$' || { echo "::error::preflight attempt is not numeric" >&2; exit 1; }
          case "$MODE" in deploy|rollback) ;; *) echo "::error::mode" >&2; exit 1 ;; esac
          { echo "sha=$SHA"; echo "mode=$MODE"; echo "preflight_run=$PRUN"; echo "preflight_attempt=$PATT"; } >> "$GITHUB_OUTPUT"

      - name: Read the facts (read token)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EVENT: workflow_dispatch
          PREFLIGHT_INPUT_SHA: ${{ steps.request.outputs.sha }}
          PREFLIGHT_INPUT_RUN: ${{ inputs.ci_run_id }}
          PREFLIGHT_INPUT_ATTEMPT: ""
        run: >-
          timeout 900 python -B -m release preflight facts --out "$RUNNER_TEMP/facts" --revision "$GITHUB_SHA"
          --evaluation-run "${{ steps.request.outputs.preflight_run }}" --evaluation-attempt "${{ steps.request.outputs.preflight_attempt }}"

      - name: Receive the preflight result (no token)
        id: receive
        working-directory: trusted
        run: |
          python -B -m release preflight verify --facts "$RUNNER_TEMP/facts" --work "$RUNNER_TEMP/received" \
            --evaluation-run "${{ steps.request.outputs.preflight_run }}" --evaluation-attempt "${{ steps.request.outputs.preflight_attempt }}" \
            --admission-out "$RUNNER_TEMP/admission.json"
          test "$(jq -r .commit "$RUNNER_TEMP/admission.json")" = "${{ steps.request.outputs.sha }}"
          echo "admission_sha256=$(sha256sum "$RUNNER_TEMP/admission.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Forward-only on the automatic path, decided from what the host REPORTS it serves (the
      # loaded processes' identity), never from what a workflow believes it last deployed. A
      # plane reporting `unavailable` is a legacy installation: the first B3 deploy proceeds.
      - name: Ordering guard
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.request.outputs.mode }}
          SHA: ${{ steps.request.outputs.sha }}
        run: python -B trusted/release/staged/ordering.py --mode "$MODE" --target "$SHA" --output "$GITHUB_OUTPUT"

      - name: Retain the admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [window, receive]
    if: needs.receive.outputs.proceed == 'true'
    environment: uat
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out the trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            release
            dependency_audit

      - name: Assert the verifier is the workflow revision and holds no credential
        run: |
          if git -C trusted config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::A git credential is persisted in the trusted checkout." >&2; exit 1
          fi
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'

      # The privileged job repeats the receiving check from ITS OWN facts before any
      # credential exists. Nothing here installs, resolves or imports candidate code.
      - name: Re-read the facts (read token)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EVENT: workflow_dispatch
          PREFLIGHT_INPUT_SHA: ${{ needs.receive.outputs.sha }}
          PREFLIGHT_INPUT_RUN: ${{ inputs.ci_run_id }}
          PREFLIGHT_INPUT_ATTEMPT: ""
        run: >-
          timeout 900 python -B -m release preflight facts --out "$RUNNER_TEMP/facts" --revision "$GITHUB_SHA"
          --evaluation-run "${{ needs.receive.outputs.preflight_run }}" --evaluation-attempt "${{ needs.receive.outputs.preflight_attempt }}"

      - name: Re-receive, and agree with the receive job
        working-directory: trusted
        env:
          HINT: ${{ needs.receive.outputs.admission_sha256 }}
        run: |
          python -B -m release preflight verify --facts "$RUNNER_TEMP/facts" --work "$RUNNER_TEMP/received" \
            --evaluation-run "${{ needs.receive.outputs.preflight_run }}" --evaluation-attempt "${{ needs.receive.outputs.preflight_attempt }}" \
            --admission-out "$RUNNER_TEMP/admission.json"
          test "$(sha256sum "$RUNNER_TEMP/admission.json" | cut -d' ' -f1)" = "$HINT"
          # The four files the host receives, and their digests. The candidate and the result
          # are the SAME bytes the receiving check admitted (facts/zips), never re-downloaded.
          mkdir -p "$RUNNER_TEMP/ship"
          cp "$RUNNER_TEMP/facts/zips/candidate.zip" "$RUNNER_TEMP/ship/candidate.zip"
          cp "$RUNNER_TEMP/facts/zips/preflight.zip" "$RUNNER_TEMP/ship/preflight.zip"
          cp "$RUNNER_TEMP/admission.json" "$RUNNER_TEMP/ship/admission.json"
          git -C trusted archive --format=tar "$GITHUB_SHA" release dependency_audit > "$RUNNER_TEMP/ship/trusted.tar"

      - name: Refuse an unset bucket or an unexpected role
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ARTIFACT_BUCKET" || { echo "::error::vars.BACKEND_ARTIFACT_BUCKET is not set (release/CUTOVER.md)" >&2; exit 1; }
          test "$ROLE" = "$EXPECTED_ROLE_ARN" || { echo "::error::the role variable is not the pinned role" >&2; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.EXPECTED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Transfer, dispatch, and read the box's own attestation
        id: ssm
        env:
          SHA: ${{ needs.receive.outputs.sha }}
          MODE: ${{ needs.receive.outputs.mode }}
        run: |
          set -euo pipefail
          OP="$(printf 'b3-%s-%s-%s' "$MODE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          PREFIX="backend/${OP}"
          for f in candidate.zip preflight.zip admission.json trusted.tar; do
            aws s3 cp "$RUNNER_TEMP/ship/$f" "s3://${ARTIFACT_BUCKET}/${PREFIX}/$f" --only-show-errors
          done
          sed -e "s|__OPERATION__|${OP}|g" -e "s|__BUCKET__|${ARTIFACT_BUCKET}|g" -e "s|__PREFIX__|${PREFIX}|g" \
              -e "s|__CANDIDATE_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/candidate.zip" | cut -d' ' -f1)|g" \
              -e "s|__PREFLIGHT_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/preflight.zip" | cut -d' ' -f1)|g" \
              -e "s|__ADMISSION_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/admission.json" | cut -d' ' -f1)|g" \
              -e "s|__TRUSTED_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/trusted.tar" | cut -d' ' -f1)|g" \
              trusted/release/staged/host-run.sh > host-run.sh
          if grep -Eq '__[A-Z0-9_]+__' host-run.sh; then echo "::error::unsubstituted placeholder" >&2; exit 1; fi
          bash -n host-run.sh
          jq -n --rawfile script host-run.sh '{commands: [$script], executionTimeout: ["3600"]}' > params.json
          CMD="$(aws ssm send-command --instance-ids "$UAT_INSTANCE_ID" --document-name AWS-RunShellScript \
                 --comment "Backend B3 ${MODE} ${SHA:0:12} (run ${GITHUB_RUN_ID})" --parameters file://params.json \
                 --query Command.CommandId --output text)"
          while :; do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$UAT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed|Cancelling) sleep 10 ;; *) break ;; esac
          done
          OUT="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$UAT_INSTANCE_ID" --query StandardOutputContent --output text)"
          printf '%s\n' "$OUT"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$UAT_INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
          printf '%s\n' "$OUT" > box.out
          python -B trusted/release/staged/markers.py --box box.out --status "$STATUS" --commit "$SHA" --output "$GITHUB_OUTPUT"

      # One vantage point at one moment: the public origin, read after the box attested.
      - name: Read both planes' loaded identity publicly
        env:
          RELEASE_ID: ${{ steps.ssm.outputs.release_id }}
        run: python -B trusted/release/staged/ordering.py --expect-serving "$RELEASE_ID"
