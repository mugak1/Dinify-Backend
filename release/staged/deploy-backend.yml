# STAGED — NOT ACTIVE. D08 B3: the replacement for .github/workflows/deploy-uat.yml.
#
# This file lives OUTSIDE .github/workflows/ on purpose: merging it activates nothing. GitHub
# runs only workflows under .github/workflows/, and a test (release/tests_staged.py) fails the
# build if a copy of this file, or anything that dispatches the host transition, appears there
# while deploy-uat.yml still exists. The cutover (release/CUTOVER.md) moves it in and DELETES
# deploy-uat.yml in the same reviewed change, so there is never a second active writer.
#
# WHAT IT DOES, in order, and which job holds which authority:
#
#   receive  (contents: read, actions: read — NO id-token)
#     Reads the facts for the triggering PREFLIGHT run from the GitHub API with the trusted
#     verifier (this workflow's own revision, never the target), and runs the B2.6 RECEIVING
#     check: the certification re-derived, the candidate and the preflight result admitted
#     by the listing's digests, the decision reproduced from the raw scanner output under
#     the TRUSTED policy, the deadline ahead by the margin. Writes the admission document.
#     Automatic runs are FORWARD-ONLY: the served identity (both planes' /release/ routes)
#     must be an ancestor of the target, or the run is a clean skip.
#
#   deploy   (id-token: write, contents: read, actions: read; environment uat)
#     Runs NO npm, NO pip, NO scanner, NO candidate code and NO checkout of the target. It
#     repeats the receiving check itself from its own facts BEFORE any credential is
#     requested (the receive job's admission is a hint that must agree byte for byte), then
#     assumes the pinned role, uploads four files to S3 under a per-operation prefix, and
#     dispatches release/staged/host-run.sh through SSM with their sha256s substituted in.
#     The HOST re-derives the admission from the bytes (release/installation.py::admit),
#     installs beside what is serving, gates configuration and migrations, switches both
#     planes, verifies the LOADED processes and restores on failure. The job reads the
#     box's own markers, then reads both planes' identity routes over the public internet.
#
# FIELDS MARKED `UNKNOWN` ARE NOT OBSERVATIONS. The artifact bucket and the role's S3/SSM
# grants for a backend prefix are owner actions recorded in release/CUTOVER.md; the host
# profile (release/profiles/uat-backend.json) is `unverified` and the host refuses it, naming
# every unknown field, until a reviewed discovery run fills it in.
name: "Backend deploy (B3)"

on:
  # A coarse pre-filter only: `workflows` matches a DISPLAY NAME. The receiving check re-reads
  # the preflight run from the API and refuses anything but preflight.yml's own run.
  workflow_run:
    workflows: ["Backend Candidate Preflight"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA on main whose certified candidate to install"
        required: true
        type: string
      preflight_run:
        description: "The Backend Candidate Preflight run whose accepted result admits it"
        required: true
        type: string
      preflight_attempt:
        description: "That run's attempt"
        required: true
        type: string
        default: "1"
      ci_run_id:
        description: "Optional: the certifying Backend CI run, when more than one succeeded for the SHA"
        required: false
        type: string
        default: ""
      mode:
        description: "deploy (forward) or rollback (a deliberate move to an older certified release)"
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions: {}

# ONE writer per host at a time on GitHub's side too. The HOST lock (profile.lockPath, shared
# with Admin — release/HOST_LOCK_CONTRACT.md) is what actually serializes the machine.
concurrency:
  group: dinify-uat-host-backend
  cancel-in-progress: false

env:
  UAT_INSTANCE_ID: i-0eeb7c0c3a36d3667
  AWS_REGION: eu-west-2
  # Pinned here and compared byte for byte with the repository variable before OIDC.
  EXPECTED_ROLE_ARN: arn:aws:iam::767397669083:role/dinify-github-deploy-role
  # UNKNOWN until the owner creates it (release/CUTOVER.md step 3). An empty value refuses.
  ARTIFACT_BUCKET: ${{ vars.BACKEND_ARTIFACT_BUCKET }}

jobs:
  receive:
    name: receive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A preflight that did not succeed is a SKIPPED deployment, not a red one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      mode: ${{ steps.request.outputs.mode }}
      preflight_run: ${{ steps.request.outputs.preflight_run }}
      preflight_attempt: ${{ steps.request.outputs.preflight_attempt }}
      proceed: ${{ steps.order.outputs.proceed }}
      admission_sha256: ${{ steps.receive.outputs.admission_sha256 }}
    steps:
      - name: Check out the trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            release
            dependency_audit

      - name: Assert the verifier is the workflow revision and holds no credential
        run: |
          if git -C trusted config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::A git credential is persisted in the trusted checkout." >&2; exit 1
          fi
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'

      # Event-derived values reach the shell ONLY through env and are validated here.
      - name: Resolve the request
        id: request
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          IN_SHA: ${{ inputs.sha }}
          IN_RUN: ${{ inputs.preflight_run }}
          IN_ATTEMPT: ${{ inputs.preflight_attempt }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHA="$IN_SHA"; PRUN="$IN_RUN"; PATT="$IN_ATTEMPT"; MODE="$IN_MODE"
          else
            SHA="$RUN_SHA"; PRUN="$RUN_ID"; PATT="$RUN_ATTEMPT"; MODE="deploy"
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::sha is not 40 lowercase hex" >&2; exit 1; }
          printf '%s' "$PRUN" | grep -Eq '^[0-9]{1,20}$' || { echo "::error::preflight run is not numeric" >&2; exit 1; }
          printf '%s' "$PATT" | grep -Eq '^[0-9]{1,4}$' || { echo "::error::preflight attempt is not numeric" >&2; exit 1; }
          case "$MODE" in deploy|rollback) ;; *) echo "::error::mode" >&2; exit 1 ;; esac
          { echo "sha=$SHA"; echo "mode=$MODE"; echo "preflight_run=$PRUN"; echo "preflight_attempt=$PATT"; } >> "$GITHUB_OUTPUT"

      - name: Read the facts (read token)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EVENT: workflow_dispatch
          PREFLIGHT_INPUT_SHA: ${{ steps.request.outputs.sha }}
          PREFLIGHT_INPUT_RUN: ${{ inputs.ci_run_id }}
          PREFLIGHT_INPUT_ATTEMPT: ""
        run: >-
          timeout 900 python -B -m release preflight facts --out "$RUNNER_TEMP/facts" --revision "$GITHUB_SHA"
          --evaluation-run "${{ steps.request.outputs.preflight_run }}" --evaluation-attempt "${{ steps.request.outputs.preflight_attempt }}"

      - name: Receive the preflight result (no token)
        id: receive
        working-directory: trusted
        run: |
          python -B -m release preflight verify --facts "$RUNNER_TEMP/facts" --work "$RUNNER_TEMP/received" \
            --evaluation-run "${{ steps.request.outputs.preflight_run }}" --evaluation-attempt "${{ steps.request.outputs.preflight_attempt }}" \
            --admission-out "$RUNNER_TEMP/admission.json"
          test "$(jq -r .commit "$RUNNER_TEMP/admission.json")" = "${{ steps.request.outputs.sha }}"
          echo "admission_sha256=$(sha256sum "$RUNNER_TEMP/admission.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Forward-only on the automatic path, decided from what the host REPORTS it serves (the
      # loaded processes' identity), never from what a workflow believes it last deployed. A
      # plane reporting `unavailable` is a legacy installation: the first B3 deploy proceeds.
      - name: Ordering guard
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.request.outputs.mode }}
          SHA: ${{ steps.request.outputs.sha }}
        run: python -B trusted/release/staged/ordering.py --mode "$MODE" --target "$SHA" --output "$GITHUB_OUTPUT"

      - name: Retain the admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [receive]
    if: needs.receive.outputs.proceed == 'true'
    environment: uat
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out the trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            release
            dependency_audit

      - name: Assert the verifier is the workflow revision and holds no credential
        run: |
          if git -C trusted config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::A git credential is persisted in the trusted checkout." >&2; exit 1
          fi
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'

      # The privileged job repeats the receiving check from ITS OWN facts before any
      # credential exists. Nothing here installs, resolves or imports candidate code.
      - name: Re-read the facts (read token)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EVENT: workflow_dispatch
          PREFLIGHT_INPUT_SHA: ${{ needs.receive.outputs.sha }}
          PREFLIGHT_INPUT_RUN: ${{ inputs.ci_run_id }}
          PREFLIGHT_INPUT_ATTEMPT: ""
        run: >-
          timeout 900 python -B -m release preflight facts --out "$RUNNER_TEMP/facts" --revision "$GITHUB_SHA"
          --evaluation-run "${{ needs.receive.outputs.preflight_run }}" --evaluation-attempt "${{ needs.receive.outputs.preflight_attempt }}"

      - name: Re-receive, and agree with the receive job
        working-directory: trusted
        env:
          HINT: ${{ needs.receive.outputs.admission_sha256 }}
        run: |
          python -B -m release preflight verify --facts "$RUNNER_TEMP/facts" --work "$RUNNER_TEMP/received" \
            --evaluation-run "${{ needs.receive.outputs.preflight_run }}" --evaluation-attempt "${{ needs.receive.outputs.preflight_attempt }}" \
            --admission-out "$RUNNER_TEMP/admission.json"
          test "$(sha256sum "$RUNNER_TEMP/admission.json" | cut -d' ' -f1)" = "$HINT"
          # The four files the host receives, and their digests. The candidate and the result
          # are the SAME bytes the receiving check admitted (facts/zips), never re-downloaded.
          mkdir -p "$RUNNER_TEMP/ship"
          cp "$RUNNER_TEMP/facts/zips/candidate.zip" "$RUNNER_TEMP/ship/candidate.zip"
          cp "$RUNNER_TEMP/facts/zips/preflight.zip" "$RUNNER_TEMP/ship/preflight.zip"
          cp "$RUNNER_TEMP/admission.json" "$RUNNER_TEMP/ship/admission.json"
          git -C trusted archive --format=tar "$GITHUB_SHA" release dependency_audit > "$RUNNER_TEMP/ship/trusted.tar"

      - name: Refuse an unset bucket or an unexpected role
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ARTIFACT_BUCKET" || { echo "::error::vars.BACKEND_ARTIFACT_BUCKET is not set (release/CUTOVER.md)" >&2; exit 1; }
          test "$ROLE" = "$EXPECTED_ROLE_ARN" || { echo "::error::the role variable is not the pinned role" >&2; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.EXPECTED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Transfer, dispatch, and read the box's own attestation
        id: ssm
        env:
          SHA: ${{ needs.receive.outputs.sha }}
          MODE: ${{ needs.receive.outputs.mode }}
        run: |
          set -euo pipefail
          OP="$(printf 'b3-%s-%s-%s' "$MODE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          PREFIX="backend/${OP}"
          for f in candidate.zip preflight.zip admission.json trusted.tar; do
            aws s3 cp "$RUNNER_TEMP/ship/$f" "s3://${ARTIFACT_BUCKET}/${PREFIX}/$f" --only-show-errors
          done
          sed -e "s|__OPERATION__|${OP}|g" -e "s|__BUCKET__|${ARTIFACT_BUCKET}|g" -e "s|__PREFIX__|${PREFIX}|g" \
              -e "s|__CANDIDATE_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/candidate.zip" | cut -d' ' -f1)|g" \
              -e "s|__PREFLIGHT_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/preflight.zip" | cut -d' ' -f1)|g" \
              -e "s|__ADMISSION_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/admission.json" | cut -d' ' -f1)|g" \
              -e "s|__TRUSTED_SHA256__|$(sha256sum "$RUNNER_TEMP/ship/trusted.tar" | cut -d' ' -f1)|g" \
              trusted/release/staged/host-run.sh > host-run.sh
          if grep -Eq '__[A-Z0-9_]+__' host-run.sh; then echo "::error::unsubstituted placeholder" >&2; exit 1; fi
          bash -n host-run.sh
          jq -n --rawfile script host-run.sh '{commands: [$script], executionTimeout: ["3600"]}' > params.json
          CMD="$(aws ssm send-command --instance-ids "$UAT_INSTANCE_ID" --document-name AWS-RunShellScript \
                 --comment "Backend B3 ${MODE} ${SHA:0:12} (run ${GITHUB_RUN_ID})" --parameters file://params.json \
                 --query Command.CommandId --output text)"
          while :; do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$UAT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed|Cancelling) sleep 10 ;; *) break ;; esac
          done
          OUT="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$UAT_INSTANCE_ID" --query StandardOutputContent --output text)"
          printf '%s\n' "$OUT"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$UAT_INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
          printf '%s\n' "$OUT" > box.out
          python -B trusted/release/staged/markers.py --box box.out --status "$STATUS" --commit "$SHA" --output "$GITHUB_OUTPUT"

      # One vantage point at one moment: the public origin, read after the box attested.
      - name: Read both planes' loaded identity publicly
        env:
          RELEASE_ID: ${{ steps.ssm.outputs.release_id }}
        run: python -B trusted/release/staged/ordering.py --expect-serving "$RELEASE_ID"
