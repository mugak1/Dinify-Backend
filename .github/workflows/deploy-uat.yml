name: Deploy UAT Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/dinify_backend_handover_uat
            source /home/ubuntu/venv_uat_handover/bin/activate
            # --- PR 1a: read-only deploy diagnostics (temporary; superseded by PR 1b) ---
            # Guarded with `|| true` so a diagnostic can never abort the deploy.
            echo "===== EC2 DEPLOY DIAGNOSTICS ====="
            python3 --version || true
            python3 -m pip --version || true
            python3 -m pip freeze || true
            echo "===== END EC2 DEPLOY DIAGNOSTICS ====="
            git checkout -- .
            git clean -fd
            git pull origin main
            python3 manage.py migrate
            python3 manage.py check --deploy
            sudo systemctl restart apache2
