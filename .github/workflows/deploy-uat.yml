name: Deploy UAT Backend

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to UAT server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/dinify_backend_handover_uat
            source /home/ubuntu/venv_uat_handover/bin/activate
            python3 --version
            git checkout -- .
            git clean -fd
            git pull origin main
            # Install pinned deps so requirements.txt edits actually take effect on the
            # box. With set -e, a failure here (e.g. PyPI unreachable) aborts the deploy
            # BEFORE migrate/check/restart, leaving the running API up.
            python3 -m pip install -r requirements.txt
            # Confirm the bumped versions are live in the deploy log (|| true: never abort).
            python3 -m pip freeze | grep -Ei '^(django|asgiref|django-cors-headers|certifi|idna|urllib3|requests|sqlparse|pymongo)==' || true
            python3 manage.py migrate
            python3 manage.py check --deploy
            sudo systemctl restart apache2
