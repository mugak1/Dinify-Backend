name: Deploy UAT Backend

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  # Manual redeploy / rollback path (post-incident 2026-08-08). The input is an
  # exact commit, never a branch: a manual trigger that deployed "whatever main
  # is right now" would reproduce defect (a). The SHA is format-validated and
  # must have a successful Backend CI run ON MAIN — verified below, before AWS
  # auth — or the job refuses to deploy it.
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA on main that has passed Backend CI"
        required: true
        type: string

concurrency:
  group: deploy-uat-backend
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════════
  # WINDOW — IS THE DEVELOPMENT SERVER SCHEDULED ON? (CI-signal C3, owner decision of
  # 26 October 2026.) The server and its database run only inside the owner's AWS
  # schedule, so a deploy that starts while they are off used to fail red with nothing
  # broken. This job decides PROCEED, DEFER or FAIL — from evidence first, the clock second:
  #
  #   the target origin answers                 -> PROCEED, whatever the time
  #   no answer, London time outside the window -> DEFER: write a summary, cancel this
  #                                                run (grey), and never exit 0
  #   no answer inside the window               -> FAIL red: that is a real outage
  #
  # It only decides whether the run continues; every later job and gate is unchanged.
  # It holds `actions: write` (to cancel its own run) and nothing else: no id-token, no
  # secret, no checkout, no third-party action and no npm or pip — only workflow shell
  # with curl, date and the preinstalled gh. A run that did not deploy is never green: if
  # the cancellation does not land, this job fails red.
  # ════════════════════════════════════════════════════════════════════════════════
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The same event gate as `deploy`: a Backend CI run that did not succeed skips the
    # whole workflow cleanly rather than probing anything.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: write

    env:
      # THE SERVER'S SCHEDULE, written once. The authority is the owner's AWS schedule for
      # instance i-0eeb7c0c3a36d3667 (Admin and Backend share it): when that schedule
      # moves, update this line, its margin, and the self-test cases below. London wall
      # time — BST in summer, GMT in winter — computed from the system tz database,
      # never a fixed UTC offset. The margin ends the window early, so a silent server in
      # its last 20 minutes is treated as off rather than as an outage.
      DEV_SERVER_WINDOW: "11:00–23:00 Europe/London"
      DEV_SERVER_WINDOW_END_MARGIN_MINUTES: "20"
      # Reachability only. What the answer says is for the existing gates downstream.
      WINDOW_PROBE_URL: https://api-test.dinifyapp.com/uat/api/v1/health/
      WINDOW_DECISION_SH: |
        # window_decide URL WINDOW MARGIN_MINUTES [NOW_EPOCH] [PROBE]
        #
        # Prints ONE line, "<WORD> at <London time>: <reason>", where WORD is PROCEED,
        # DEFER or FAIL, and sets WINDOW_DECISION, WINDOW_AT and WINDOW_REASON.
        # Evidence first, the clock second:
        #   the origin answered (any HTTP status)       -> PROCEED, whatever the time
        #   no answer, London time outside the window   -> DEFER
        #   no answer, London time inside the window    -> FAIL (a real outage)
        # "Inside" is [start, end - margin). NOW_EPOCH and PROBE ("answered" | "silent")
        # are injectable for the self-test; when absent, the clock is read and URL probed.
        # Anything it cannot establish is FAIL, never PROCEED and never DEFER.
        window_decide() {
          local url="${1:-}" window="${2:-}" margin="${3:-}" now="${4:-}" probe="${5:-}"
          local re='^([01][0-9]|2[0-3]):([0-5][0-9])–([01][0-9]|2[0-3]):([0-5][0-9]) ([A-Za-z]+/[A-Za-z_]+)$'
          local start=-1 end=-1 zone="" hm minute
          WINDOW_DECISION=FAIL; WINDOW_AT=unknown; WINDOW_REASON=""
          if [[ "$window" =~ $re ]]; then
            start=$((10#${BASH_REMATCH[1]} * 60 + 10#${BASH_REMATCH[2]}))
            end=$((10#${BASH_REMATCH[3]} * 60 + 10#${BASH_REMATCH[4]}))
            zone="${BASH_REMATCH[5]}"
          fi
          if [ -z "$zone" ]; then
            WINDOW_REASON="the window constant '${window}' is not 'HH:MM–HH:MM Area/City'"
          elif [[ ! "$margin" =~ ^[0-9]{1,3}$ ]]; then
            WINDOW_REASON="the end margin '${margin}' is not a number of minutes"
          else
            end=$((end - 10#${margin}))
            if [ "$start" -ge "$end" ]; then
              WINDOW_REASON="the window '${window}' less ${margin} minutes is empty"
            elif [ ! -f "${TZDIR:-/usr/share/zoneinfo}/${zone}" ]; then
              # An unknown TZ makes date(1) silently fall back to UTC: refuse instead.
              WINDOW_REASON="the time zone '${zone}' is not in the system tz database"
            else
              if [ -z "$now" ]; then now="$(date -u +%s)" || now=""; fi
              if [[ ! "$now" =~ ^[0-9]+$ ]]; then
                WINDOW_REASON="the clock could not be read"
              else
                WINDOW_AT="$(TZ="$zone" date -d "@${now}" '+%Y-%m-%d %H:%M %Z')" || WINDOW_AT=unknown
                hm="$(TZ="$zone" date -d "@${now}" '+%H:%M')" || hm=""
                if [[ ! "$hm" =~ ^([0-9]{2}):([0-9]{2})$ ]]; then
                  WINDOW_AT=unknown
                  WINDOW_REASON="the ${zone} time could not be computed"
                else
                  minute=$((10#${BASH_REMATCH[1]} * 60 + 10#${BASH_REMATCH[2]}))
                  if [ -z "$probe" ]; then probe="$(window_probe "$url")" || probe=""; fi
                  case "$probe" in
                    answered)
                      WINDOW_DECISION=PROCEED
                      WINDOW_REASON="${url} answered" ;;
                    silent)
                      if [ "$minute" -ge "$start" ] && [ "$minute" -lt "$end" ]; then
                        WINDOW_DECISION=FAIL
                        WINDOW_REASON="${url} did not answer inside the scheduled window ${window} (end margin ${margin} min): a real outage"
                      else
                        WINDOW_DECISION=DEFER
                        WINDOW_REASON="${url} did not answer and the server is scheduled off (${window}, end margin ${margin} min)"
                      fi ;;
                    *)
                      WINDOW_REASON="the probe result '${probe}' is neither answered nor silent" ;;
                  esac
                fi
              fi
            fi
          fi
          printf '%s at %s: %s\n' "$WINDOW_DECISION" "$WINDOW_AT" "$WINDOW_REASON"
        }

        # window_probe URL -> "answered" if any HTTP status came back within three
        # attempts, else "silent". Reachability only: what the answer SAYS is for the
        # existing gates downstream, which are unchanged.
        window_probe() {
          local url="$1" code attempt
          for attempt in 1 2 3; do
            code="$(curl -sS -o /dev/null --connect-timeout 10 --max-time 20 -w '%{http_code}' "$url" 2>/dev/null)" || true
            echo "window probe ${attempt}/3: ${url} -> HTTP ${code:-000}" >&2
            if [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then echo answered; return 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo silent
        }

    steps:
      - name: Self-test the window decision
        run: |
          set -euo pipefail
          eval "$WINDOW_DECISION_SH"
          # The cases are written for the window constant and margin above. When the
          # schedule moves, move them with it. Each case is a UTC instant, a probe result,
          # and the expected "<WORD> at <London time>".
          # The daylight-saving days use instants a fixed UTC offset gets wrong.
          FAILED=0
          check() {
            local utc="$1" probe="$2" want="$3" got
            got="$(window_decide "https://self-test.invalid/" "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES" "$(date -u -d "$utc" +%s)" "$probe")"
            if [ "${got%%: *}" = "$want" ]; then
              echo "ok    ${utc} ${probe} -> ${got}"
            else
              echo "FAIL  ${utc} ${probe}: expected '${want}', got '${got}'"; FAILED=1
            fi
          }
          check 2026-10-26T14:00:00Z answered "PROCEED at 2026-10-26 14:00 GMT"   # in window, answering
          check 2026-10-26T14:00:00Z silent   "FAIL at 2026-10-26 14:00 GMT"      # in window, silent: an outage
          check 2026-10-27T03:00:00Z silent   "DEFER at 2026-10-27 03:00 GMT"     # off window, silent
          check 2026-10-27T03:00:00Z answered "PROCEED at 2026-10-27 03:00 GMT"   # off window, answering: evidence wins
          check 2026-10-26T10:59:00Z silent   "DEFER at 2026-10-26 10:59 GMT"     # one minute before the start
          check 2026-10-26T11:00:00Z silent   "FAIL at 2026-10-26 11:00 GMT"      # the start is inside
          check 2026-10-26T22:39:00Z silent   "FAIL at 2026-10-26 22:39 GMT"      # last minute before the margin
          check 2026-10-26T22:40:00Z silent   "DEFER at 2026-10-26 22:40 GMT"     # the 20-minute margin begins
          check 2026-10-26T22:45:00Z silent   "DEFER at 2026-10-26 22:45 GMT"     # inside the margin
          check 2026-10-26T22:45:00Z answered "PROCEED at 2026-10-26 22:45 GMT"   # inside the margin, answering
          check 2026-10-26T23:00:00Z silent   "DEFER at 2026-10-26 23:00 GMT"     # the end is outside
          check 2026-07-15T10:30:00Z silent   "FAIL at 2026-07-15 11:30 BST"      # summer: UTC 10:30 is 11:30 London
          check 2026-07-15T22:30:00Z silent   "DEFER at 2026-07-15 23:30 BST"     # summer: UTC 22:30 is 23:30 London
          # 29 March 2026: clocks go forward at 01:00 UTC.
          check 2026-03-29T00:30:00Z silent   "DEFER at 2026-03-29 00:30 GMT"
          check 2026-03-29T01:30:00Z silent   "DEFER at 2026-03-29 02:30 BST"
          check 2026-03-29T10:30:00Z silent   "FAIL at 2026-03-29 11:30 BST"      # UTC+0 would say 10:30, DEFER
          check 2026-03-29T22:30:00Z silent   "DEFER at 2026-03-29 23:30 BST"     # UTC+0 would say 22:30, FAIL
          # 25 October 2026: clocks go back at 01:00 UTC; 01:30 London happens twice.
          check 2026-10-25T00:30:00Z silent   "DEFER at 2026-10-25 01:30 BST"
          check 2026-10-25T01:30:00Z silent   "DEFER at 2026-10-25 01:30 GMT"
          check 2026-10-25T10:30:00Z silent   "DEFER at 2026-10-25 10:30 GMT"     # UTC+1 would say 11:30, FAIL
          check 2026-10-25T22:30:00Z silent   "FAIL at 2026-10-25 22:30 GMT"      # UTC+1 would say 23:30, DEFER
          check 2026-10-25T22:30:00Z answered "PROCEED at 2026-10-25 22:30 GMT"
          # What it cannot establish is FAIL, never PROCEED or DEFER.
          [[ "$(window_decide u "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES" 1793000000 maybe)" == FAIL* ]] || { echo "FAIL  an unknown probe result must FAIL"; FAILED=1; }
          [[ "$(window_decide u "11:00-23:00 Europe/London" 20 1793000000 silent)" == FAIL* ]] || { echo "FAIL  a malformed window must FAIL"; FAILED=1; }
          [[ "$(window_decide u "11:00–23:00 Nowhere/Atlantis" 20 1793000000 silent)" == FAIL* ]] || { echo "FAIL  an unknown zone must FAIL"; FAILED=1; }
          [[ "$(window_decide u "$DEV_SERVER_WINDOW" x 1793000000 silent)" == FAIL* ]] || { echo "FAIL  a malformed margin must FAIL"; FAILED=1; }
          [[ "$(window_decide u "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES" never silent)" == FAIL* ]] || { echo "FAIL  an unreadable clock must FAIL"; FAILED=1; }
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::The window decision failed its self-test; refusing to decide with it." >&2
            exit 1
          fi
          echo "window self-test: all cases passed"

      - name: Decide PROCEED, DEFER or FAIL
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          eval "$WINDOW_DECISION_SH"
          window_decide "$WINDOW_PROBE_URL" "$DEV_SERVER_WINDOW" "$DEV_SERVER_WINDOW_END_MARGIN_MINUTES"
          case "$WINDOW_DECISION" in PROCEED|DEFER|FAIL) ;; *) WINDOW_DECISION=FAIL ;; esac
          echo "decision=${WINDOW_DECISION}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TARGET="${INPUT_SHA:-}"; else TARGET="${RUN_SHA:-}"; fi
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || TARGET="(not a full 40-character SHA)"
          case "$WINDOW_DECISION" in
            PROCEED)
              echo "PROCEED: the run continues, and every existing gate still applies." ;;
            DEFER)
              echo "::notice::Deploy UAT Backend deferred: ${WINDOW_REASON} (${WINDOW_AT}). This run cancels itself."
              {
                echo "## Deploy UAT Backend: DEFERRED — the development server is scheduled off"
                echo ""
                echo "- Target SHA: \`${TARGET}\`"
                echo "- London time: ${WINDOW_AT}"
                echo "- Evidence: ${WINDOW_REASON}"
                echo ""
                echo "The development server is scheduled off (${DEV_SERVER_WINDOW}). Re-run all jobs at or after ${DEV_SERVER_WINDOW%%–*} London, or dispatch Deploy UAT Backend with sha=${TARGET}."
                echo ""
                echo "Nothing was deployed. This run cancels itself, so it shows as cancelled (grey). If it shows red instead, the cancellation did not land; nothing was deployed then either."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            FAIL)
              echo "::error::Deploy UAT Backend stopped before deploying: ${WINDOW_REASON} (${WINDOW_AT})." >&2
              {
                echo "## Deploy UAT Backend: FAILED before deploying"
                echo ""
                echo "- Target SHA: \`${TARGET}\`"
                echo "- London time: ${WINDOW_AT}"
                echo "- Evidence: ${WINDOW_REASON}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac

      # The ONLY way out with status 0 is PROCEED. A deferred run cancels itself; the
      # cancellation is asynchronous, so this step then waits for the runner to stop it,
      # and if that has not happened within about two minutes it fails red.
      - name: Enforce the decision (a deferred run cancels itself)
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.decide.outputs.decision }}
        run: |
          set -euo pipefail
          case "${DECISION:-}" in
            PROCEED) exit 0 ;;
            DEFER) ;;
            *) echo "::error::No PROCEED decision (got '${DECISION:-}'). Failing closed." >&2; exit 1 ;;
          esac
          echo "DEFER: cancelling run ${GITHUB_RUN_ID} so it concludes cancelled, never green."
          if ! gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"; then
            echo "::error::The deploy was deferred but the cancellation request failed. Failing red: a run that did not deploy is never green." >&2
            exit 1
          fi
          for i in $(seq 1 24); do
            sleep 5
            STATE="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + "/" + (.conclusion // "")' 2>/dev/null)" || STATE=unreadable
            echo "waiting for the cancellation to land (${i}/24): run ${STATE}"
          done
          echo "::error::The deploy was deferred and its cancellation requested, but the run was not cancelled within about 2 minutes. Failing red: a run that did not deploy is never green." >&2
          exit 1

  deploy:
    needs: window
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    # OIDC (no inbound SSH, no stored credentials): the job mints a short-lived
    # identity token GitHub signs per-run; AWS trusts it for one narrowly-scoped
    # role. No deploy, CI or audit workflow references `secrets.`: OIDC needs no
    # stored credential. The legacy UAT_SSH_* secrets were deleted 2026-08-18
    # with the old-host teardown. The one stored secret, CLAUDE_CODE_OAUTH_TOKEN,
    # is read only by the two Claude workflows, which hold no `id-token`.
    permissions:
      id-token: write
      contents: read
      # actions: read lets the dispatch pre-flight list Backend CI runs to
      # prove the requested SHA passed CI on main before it can reach the box.
      actions: read
    env:
      UAT_INSTANCE_ID: i-0eeb7c0c3a36d3667
    steps:
      # Injection hygiene: event-derived values are never interpolated inline
      # into run: — inputs.sha is operator-typed free text, and this deploy
      # script ultimately executes as root on the UAT box, so a raw ${{ }}
      # inside run: would be a script-injection surface. Everything from the
      # event is mapped through env: and read only as "$SHELL_VARS";
      # TARGET_SHA / ALLOW_BACKWARD leave this step only after validation.
      - name: Resolve and validate deploy target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$DISPATCH_SHA"
            # Rollback is the manual trigger's one legitimate backwards move —
            # see the forward-only guard in the deploy script.
            ALLOW_BACKWARD="true"
          else
            TARGET_SHA="$WORKFLOW_RUN_SHA"
            ALLOW_BACKWARD="false"
          fi
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Deploy target rejected: expected a full 40-character lowercase hex commit SHA." >&2
            exit 1
          fi
          case "$ALLOW_BACKWARD" in
            true|false) ;;
            *) echo "::error::ALLOW_BACKWARD must be literal true or false." >&2; exit 1 ;;
          esac
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"
          echo "ALLOW_BACKWARD=${ALLOW_BACKWARD}" >> "$GITHUB_ENV"
          echo "Deploy target: ${TARGET_SHA} (event: ${EVENT_NAME}, allow_backward: ${ALLOW_BACKWARD})"

      # Dispatch pre-flight (defect (e)): the manual path must not be able to
      # reproduce defect (a). The requested SHA must have a successful
      # "Backend CI" run ON MAIN — Backend CI also runs on PR branches, and a
      # branch-green SHA must not be deployable.
      - name: Verify dispatched SHA passed Backend CI on main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_GREEN_RUNS="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')"
          if [ "${MAIN_GREEN_RUNS:-0}" -lt 1 ]; then
            echo "::error::Refusing to deploy ${TARGET_SHA}: no successful 'Backend CI' run on branch main exists for it. Only a commit that has passed Backend CI on main may be deployed." >&2
            exit 1
          fi
          echo "CI verification: ${MAIN_GREEN_RUNS} successful Backend CI run(s) on main for ${TARGET_SHA}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::767397669083:role/dinify-github-deploy-role
          aws-region: eu-west-2

      - name: Write deploy script
        run: |
          cat > deploy.sh <<'DEPLOY_SCRIPT'
          #!/bin/bash
          # The shebang is load-bearing: AWS-RunShellScript otherwise executes with
          # /bin/sh (dash on Ubuntu), and the 0027 permission gate below uses
          # bash-only arithmetic ($((8#..)) and (( ))).
          set -e
          # __TARGET_SHA__ / __ALLOW_BACKWARD__ are placeholders the workflow
          # substitutes with sed AFTER validating both values (40-hex; literal
          # true/false) — the quoted heredoc keeps everything else free of
          # workflow-time expansion.
          TARGET_SHA="__TARGET_SHA__"
          ALLOW_BACKWARD="__ALLOW_BACKWARD__"
          cd /home/ubuntu/dinify_backend_handover_uat
          source /home/ubuntu/venv_uat_handover/bin/activate
          # SSM runs this script as root; the SSH deploy ran as ubuntu. Everything
          # that touches the ubuntu-owned repo or venv must run AS ubuntu
          # (sudo -u ubuntu): root git refuses the tree outright ("detected dubious
          # ownership"), and the safe.directory override git suggests would be
          # worse — root's git fetch would write root-owned objects into the
          # ubuntu-owned tree and root's pip would write root-owned packages into
          # the venv, going green today and breaking the NEXT deploy. sudo resets
          # PATH (secure_path), so sudo'd commands must use the venv interpreter
          # by absolute path — hence "$VENV_PY" everywhere below.
          VENV_PY="$(command -v python3)"
          "$VENV_PY" --version
          # ---- Deploy-target pinning (post-incident 2026-08-08) ----
          # On 2026-08-08 the deploy run for 7b0e815 reported success while this
          # box stayed on 4ccae37 — for 39 hours, until a manual re-run. A green
          # deploy that did not deploy. The script used to pull whatever main
          # happened to be at execution time, and nothing verified what actually
          # landed. That class is closed here: the workflow injects the ONE
          # commit its triggering CI run certified (TARGET_SHA), the box fetches
          # and checks out exactly that SHA, refuses to move backwards on the
          # automatic path (a queued older run must not downgrade the box under
          # possibly newer schema), and asserts HEAD equals the target. If the
          # box's HEAD does not equal the intended commit, the deploy fails
          # loudly instead of green-and-stale.
          sudo -u ubuntu git fetch origin
          sudo -u ubuntu git rev-parse --verify "${TARGET_SHA}^{commit}" >/dev/null \
            || { echo "Target ${TARGET_SHA} not present after fetch" >&2; exit 1; }
          # Forward-only guard: ALLOW_BACKWARD is true only for workflow_dispatch
          # (rollback is its legitimate use), false for the automatic path.
          # The DEPLOY-SKIP:/DEPLOYED-HEAD: markers are grepped from SSM stdout by the workflow — keep them above the pip/migrate output (SSM keeps only the FIRST 24,000 chars).
          if sudo -u ubuntu git merge-base --is-ancestor HEAD "${TARGET_SHA}"; then
            : # target is equal to or ahead of deployed HEAD — proceed (equal = idempotent redeploy)
          elif [ "${ALLOW_BACKWARD}" = "true" ]; then
            echo "WARNING: deliberately moving BACKWARDS from $(sudo -u ubuntu git rev-parse HEAD) to ${TARGET_SHA}."
            echo "WARNING: migrations already applied by newer code are NOT reversed. Confirm schema compatibility (expand/contract)."
          else
            echo "DEPLOY-SKIP: target ${TARGET_SHA} is behind deployed HEAD $(sudo -u ubuntu git rev-parse HEAD); a newer deploy already landed."
            exit 0
          fi
          sudo -u ubuntu git checkout -- .
          sudo -u ubuntu git clean -fd
          # --detach is deterministic from any starting state — never assume
          # whether the box is currently on a branch or already detached.
          sudo -u ubuntu git checkout --detach "${TARGET_SHA}"
          DEPLOYED="$(sudo -u ubuntu git rev-parse HEAD)"
          if [ "${DEPLOYED}" != "${TARGET_SHA}" ]; then
            echo "FATAL: HEAD is ${DEPLOYED}, expected ${TARGET_SHA} — refusing to continue" >&2
            exit 1
          fi
          echo "DEPLOYED-HEAD: ${DEPLOYED}"
          # Install pinned deps so requirements.txt edits actually take effect on the
          # box. With set -e, a failure here (e.g. PyPI unreachable) aborts the deploy
          # BEFORE migrate/check/restart, leaving the running API up.
          # -q keeps the deploy log inside SSM's 24,000-char inline output cap —
          # pip failures still print in full.
          sudo -u ubuntu "$VENV_PY" -m pip install -q -r requirements.txt
          # Confirm the bumped versions are live in the deploy log (|| true: never abort).
          sudo -u ubuntu "$VENV_PY" -m pip freeze | grep -Ei '^(django|asgiref|django-cors-headers|certifi|idna|urllib3|requests|sqlparse|pymongo)==' || true
          sudo -u ubuntu "$VENV_PY" manage.py migrate
          sudo -u ubuntu "$VENV_PY" manage.py check --deploy
          # ---- Runtime-parity gates (post-incident 2026-07-17) ----
          # Apache/mod_wsgi runs as www-data, and python-decouple reads the project
          # .env at settings import. A .env that ubuntu can read but www-data cannot
          # (the incident: ubuntu:ubuntu mode 600) passes every CLI check above and
          # then kills the app at import with PermissionError after the restart.
          # Everything below runs BEFORE the restart so a bad config aborts the
          # deploy with the old workers still serving. No secret values are ever
          # printed — only ownership and mode.
          env_owner="$(stat -c '%U:%G' .env)"
          env_mode="$(stat -c '%a' .env)"
          echo ".env ownership/mode: ${env_owner} ${env_mode}"
          if ! sudo -u www-data test -r .env; then
            echo "DEPLOY BLOCKED: www-data cannot read $(pwd)/.env (${env_owner} ${env_mode})." >&2
            echo "The mod_wsgi runtime would fail at settings import with PermissionError." >&2
            echo "Fix on the box: chown ubuntu:www-data .env && chmod 640 .env" >&2
            exit 1
          fi
          # Secret-file mode policy: group-READ is how www-data is granted access,
          # so allow it — but reject group-WRITE (www-data could rewrite the
          # config) and every 'other' permission bit (bitmask 0027). 640 passes;
          # 660, 644 and 642 fail. Readability itself (e.g. an unreadable 600
          # file) is enforced by the sudo test above.
          env_permissions=$((8#$env_mode))
          if (( env_permissions & 0027 )); then
            echo "DEPLOY BLOCKED: $(pwd)/.env (mode ${env_mode}) is too permissive for a secrets file:" >&2
            echo "group-write and all 'other' permission bits are forbidden (expected e.g. 640)." >&2
            echo "Fix on the box: chown ubuntu:www-data .env && chmod 640 .env" >&2
            exit 1
          fi
          # Prove the runtime user can actually resolve the required settings from
          # .env (presence only — values are never printed).
          sudo -u www-data "$VENV_PY" - <<'PYCHECK'
          from decouple import Config, RepositoryEnv
          try:
              cfg = Config(RepositoryEnv('.env'))
          except OSError as exc:
              raise SystemExit(f'DEPLOY BLOCKED: cannot read .env as the runtime user: {exc}')
          missing = [k for k in ('SECRET_KEY', 'DINER_CAP_KEY')
                     if not (cfg.get(k, default=None) or '').strip()]
          if missing:
              raise SystemExit('DEPLOY BLOCKED: .env is readable but missing/empty: '
                               + ', '.join(missing))
          print('www-data can read and resolve required settings from .env')
          PYCHECK
          # Re-run the deploy check AS the runtime user, from the project directory,
          # with the venv interpreter. sudo's clean environment plus the www-data
          # identity reproduce what mod_wsgi will see at import time.
          sudo -u www-data "$VENV_PY" manage.py check --deploy
          # Validate the Apache configuration itself before bouncing it.
          sudo apachectl configtest
          sudo systemctl restart apache2
          # Health gate: the deploy is not a success unless the WSGI app boots and
          # routes. Probe through the local Apache (--resolve pins the public vhost
          # to 127.0.0.1 with correct SNI + certificate). A healthy app answers
          # exactly 405 (Method Not Allowed) to a bare GET on the login route;
          # anything else after the retries fails the deploy loudly instead of
          # green-and-down.
          status=000
          for attempt in 1 2 3 4 5; do
            sleep 3
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              --resolve api-test.dinifyapp.com:443:127.0.0.1 \
              https://api-test.dinifyapp.com/uat/api/v1/users/auth/login/ || true)"
            status="${status:-000}"
            echo "Health probe attempt ${attempt}: HTTP ${status} (expect 405)"
            if [ "$status" -eq 405 ]; then
              break
            fi
          done
          if [ "$status" -ne 405 ]; then
            echo "UAT API failed its post-restart health probe (last HTTP status: ${status}; expected 405)." >&2
            echo "The WSGI app is likely failing to boot or routing incorrectly. Verify the" >&2
            echo "project .env is readable by www-data (e.g. ubuntu:www-data, mode 640) and" >&2
            echo "carries every required setting (e.g. DINER_CAP_KEY), then re-run this" >&2
            echo "workflow." >&2
            exit 1
          fi
          # DB-connectivity gate: the 405 probe above proves TLS/Apache/WSGI
          # routing, NOT that the restarted processes can reach PostgreSQL.
          # migrate and check --deploy earlier in this script prove PRE-restart
          # connectivity under set -e; this gate proves the RESTARTED daemon
          # processes' connectivity. Both are required; neither substitutes for
          # the other. The health endpoint answers HTTP 200 even when the
          # database is down (status: degraded), so the body is parsed as JSON
          # — never substring-matched — and only database == "connected" passes.
          db_status=000
          db_state="unprobed"
          for attempt in 1 2 3 4 5; do
            sleep 3
            db_response="$(curl -sS --max-time 15 \
              --resolve api-test.dinifyapp.com:443:127.0.0.1 \
              -w '\n%{http_code}' \
              https://api-test.dinifyapp.com/uat/api/v1/health/ || true)"
            db_status="$(printf '%s' "$db_response" | tail -n 1)"
            db_status="${db_status:-000}"
            db_body="$(printf '%s' "$db_response" | sed '$d')"
            db_state="$(printf '%s' "$db_body" | "$VENV_PY" -c 'import json,sys; print(json.load(sys.stdin).get("database", "absent"))' 2>/dev/null || echo unparseable)"
            echo "DB health probe attempt ${attempt}: HTTP ${db_status}, database=${db_state} (expect 200, connected)"
            if [ "$db_status" -eq 200 ] && [ "$db_state" = "connected" ]; then
              break
            fi
          done
          if [ "$db_status" -ne 200 ] || [ "$db_state" != "connected" ]; then
            echo "UAT API failed its post-restart DATABASE health probe (last: HTTP ${db_status}, database=${db_state})." >&2
            echo "This is not the routing failure the 405 gate above catches: Apache and the" >&2
            echo "WSGI processes restarted and are answering, but the restarted daemons cannot" >&2
            echo "reach PostgreSQL. Check the RDS endpoint, security groups and the DB" >&2
            echo "credentials in the project .env, then re-run this workflow." >&2
            exit 1
          fi
          DEPLOY_SCRIPT
          # Substitution happens AFTER the quoted heredoc is written (nothing
          # expands at write time) and only with re-validated values — the
          # injection control lives beside the injection site.
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::TARGET_SHA failed re-validation before substitution." >&2
            exit 1
          fi
          if ! printf '%s' "$ALLOW_BACKWARD" | grep -Eq '^(true|false)$'; then
            echo "::error::ALLOW_BACKWARD failed re-validation before substitution." >&2
            exit 1
          fi
          sed -i -e "s/__TARGET_SHA__/${TARGET_SHA}/" -e "s/__ALLOW_BACKWARD__/${ALLOW_BACKWARD}/" deploy.sh
          if grep -Eq '__TARGET_SHA__|__ALLOW_BACKWARD__' deploy.sh; then
            echo "::error::deploy.sh still carries an unsubstituted placeholder." >&2
            exit 1
          fi

      - name: Deploy to UAT server via SSM
        run: |
          # jq --rawfile embeds the script as one JSON string, sidestepping every
          # quoting hazard (the PYCHECK heredoc, single quotes, $-expansions).
          jq -n --rawfile script deploy.sh \
            '{commands: [$script], executionTimeout: ["1500"]}' > params.json
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$UAT_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy UAT backend (run ${GITHUB_RUN_ID})" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)"
          echo "SSM command dispatched: ${CMD_ID}"
          # send-command returns at DISPATCH, not completion — the remote set -e
          # cannot fail this job on its own. Poll until the invocation leaves the
          # transitional states, then gate the job on Status == Success. The
          # `|| echo Pending` absorbs the InvocationDoesNotExist race right after
          # dispatch; the job-level timeout-minutes bounds the loop.
          STATUS="Pending"
          while :; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$UAT_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Pending|InProgress|Delayed|Cancelling) sleep 10 ;;
              *) break ;;
            esac
          done
          echo "SSM invocation finished: ${STATUS}"
          # stdout is CAPTURED (then echoed) rather than only streamed: the
          # DEPLOYED-HEAD:/DEPLOY-SKIP: markers are read back out of it below,
          # because the retained record must reflect the BOX's own assertion of
          # what landed, never this workflow's intent.
          REMOTE_STDOUT="$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$UAT_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text)"
          echo "---- remote stdout (SSM truncates beyond 24,000 chars) ----"
          printf '%s\n' "$REMOTE_STDOUT"
          echo "---- remote stderr ----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$UAT_INSTANCE_ID" \
            --query 'StandardErrorContent' --output text >&2
          if [ "$STATUS" != "Success" ]; then
            echo "::error::UAT deploy failed on the box (SSM status: ${STATUS}). See remote output above." >&2
            exit 1
          fi
          FINISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Forward-only skip is green but never quiet — a quiet green is the
          # exact smell the 2026-08-08 pinning exists to eliminate.
          if printf '%s\n' "$REMOTE_STDOUT" | grep -q '^DEPLOY-SKIP:'; then
            SKIP_LINE="$(printf '%s\n' "$REMOTE_STDOUT" | grep -m1 '^DEPLOY-SKIP:' || true)"
            BOX_HEAD="$(printf '%s' "$SKIP_LINE" | grep -oE 'deployed HEAD [0-9a-f]{40}' | grep -oE '[0-9a-f]{40}' || true)"
            echo "::notice::UAT deploy SKIPPED (already ahead): target ${TARGET_SHA} is behind box HEAD ${BOX_HEAD:-unknown}; a newer deploy already landed."
            {
              echo "## UAT deploy: SKIPPED (already ahead)"
              echo "- Trigger: \`${GITHUB_EVENT_NAME}\` — finished ${FINISHED_AT}"
              echo "- Requested target: \`${TARGET_SHA}\`"
              echo "- Box HEAD (unchanged): \`${BOX_HEAD:-unknown}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DEPLOYED_HEAD="$(printf '%s\n' "$REMOTE_STDOUT" | grep -m1 -oE '^DEPLOYED-HEAD: [0-9a-f]{40}' | grep -oE '[0-9a-f]{40}' || true)"
          if [ -z "${DEPLOYED_HEAD}" ]; then
            echo "::error::SSM reported Success but the remote output carries no DEPLOYED-HEAD: (or DEPLOY-SKIP:) marker — refusing to report an unproven deploy as green." >&2
            exit 1
          fi
          if [ "${DEPLOYED_HEAD}" != "${TARGET_SHA}" ]; then
            echo "::error::Box-asserted HEAD ${DEPLOYED_HEAD} does not match the intended target ${TARGET_SHA}." >&2
            exit 1
          fi
          {
            echo "## UAT deploy: SUCCESS"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\` — finished ${FINISHED_AT}"
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Box-asserted HEAD (\`DEPLOYED-HEAD:\`): \`${DEPLOYED_HEAD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
