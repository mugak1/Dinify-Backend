name: Backend Dependency Audit

# Weekly pip-audit sweep so the requirements.txt advisory-zero state can't
# silently erode. Scheduled + manual only — NOT triggered on PRs/pushes, so it
# never produces a PR check and can't become a required/blocking gate. A
# failure (advisories found) fires GitHub's scheduled-workflow notification.
on:
  schedule:
    - cron: '30 6 * * 1'   # Mondays 06:30 UTC (09:30 EAT)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Mirrors the live UAT interpreter (Ubuntu 24.04, Python 3.12.3) and
          # moves with ci.yml — the two pins are the same value and must be
          # changed in the same PR as the box's venv rebuild.
          python-version: '3.12.3'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
