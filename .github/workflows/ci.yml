name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_dinify
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_dinify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to match the UAT/prod EC2 runtime exactly (venv runs Python 3.10.12).
          # CI must reproduce prod's interpreter so a 3.10-only issue can't pass CI and
          # then fail at the live WSGI import. Do not bump without confirming prod first.
          python-version: '3.10.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations consistency
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: test_dinify
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          python -m django check --settings=dinify_backend.test_settings
          python -m django makemigrations --check --dry-run --settings=dinify_backend.test_settings

      - name: Money-field guard
        run: python scripts/check_money_fields.py

      - name: Ambient-authority gate
        # TENANT-AUTH-00: the customer plane must not read User.roles to grant
        # platform authority. A Dinify administrator used to be defined by a role
        # string, and that predicate was wired as a cross-tenant bypass across the
        # portal — while account_type separately decided which plane an account
        # could log into. The predicates are gone; this keeps them gone.
        # PERMANENT (unlike the ratchet below, which self-terminates at zero):
        # there is no future state in which reintroducing this is acceptable.
        run: python scripts/check_ambient_authority.py

      - name: Tenant-relation ratchet
        # The committed tenant-relation baseline may only SHRINK — a new writable
        # relation must be classified, not baselined. Reads the baseline at the
        # comparison base via git (fetched at runtime by the script); fails closed
        # in CI if the base can't be read. On a PR the base is GITHUB_BASE_REF; on a
        # PUSH it is github.event.before (the pre-push commit), plumbed below — the
        # branch tip already contains the push and would hide an addition.
        # TEMPORARY: delete this step, the script, and the baseline file when the
        # baseline reaches zero (TENANT-STRUCT-00).
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/check_tenant_relation_ratchet.py

      - name: Tenant-isolation closure gate
        # Fail-fast adversarial boundary suite (TENANT-ISO-PR6A): the focused
        # closure matrix + the deep capability / relationship / concurrency /
        # write-surface / delegated-session suites it builds on. Runs BEFORE the
        # full suite so a broken restaurant/diner tenant boundary — or a broken
        # delegated-administrator boundary — fails early with a clear signal.
        # Mirrors scripts/verify.sh; does NOT replace "Run tests" below.
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: test_dinify
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          python -m django test \
            dinify_backend.tenancy.tests_tenant_isolation_closure \
            dinify_backend.tenancy.tests_ambient_authority \
            restaurants_app.tests_diner_capability \
            restaurants_app.tests_menu_relationship_integrity \
            restaurants_app.tests_menu_relationships_concurrency \
            restaurants_app.tests_write_surface_tenancy \
            platform_admin_app.tests_delegated_session \
            --settings=dinify_backend.test_settings --verbosity=2 --timing

      - name: Run tests
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: test_dinify
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          python -m django test --settings=dinify_backend.test_settings --verbosity=2 --timing
