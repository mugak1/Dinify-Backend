name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # SINGLE PINNED LEG, matching the live UAT/prod EC2 venv (Ubuntu 24.04,
        # Python 3.12.3). CI must keep reproducing prod's interpreter so a
        # version-specific issue can't pass CI and then fail at the live WSGI
        # import. Same version string, so same language features and stdlib
        # behaviour — not a byte-identical build: setup-python installs an
        # upstream CPython while the box runs Ubuntu's package with security
        # patches backported under that version. That was equally true of the
        # 3.10.12 pin this replaces.
        # THE PIN AND THE BOX MOVE TOGETHER. Changing it here without rebuilding
        # the venv (and mod_wsgi against it) — or the reverse — silently ends the
        # mirror, and audit.yml pins the same value and must move in the same PR.
        # The 3.10 leg was deleted here on cutover completion (2026-08), as the
        # dual-leg comment it carried instructed.
        python-version: ['3.12.3']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_dinify
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_dinify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DEPENDENCY AUDIT, part 1 of 2 (D08 B2.1 — dependency_audit/README.md). Taken
      # IMMEDIATELY after installation with THIS interpreter's own `pip inspect`: the
      # exact package inventory the suite below runs against — pinned requirements, their
      # unpinned transitives and the pip upgraded above. Offline. Refuses if a declared
      # requirement is missing or the interpreter is not the 3.12.3 target.
      - name: Dependency audit — snapshot the installed inventory
        run: python -m dependency_audit snapshot

      - name: Check migrations consistency
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: test_dinify
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          python -m django check --settings=dinify_backend.test_settings
          python -m django makemigrations --check --dry-run --settings=dinify_backend.test_settings

      - name: Money-field guard
        # Each of the three guards below runs its own --self-test BEFORE its scan (inside
        # the default invocation, so it cannot be bypassed by editing this line), and
        # exits 1 on a violation, 2 when the scan was INCOMPLETE (never clean) and 3 when
        # the self-test failed. See scripts/tests_guards.py.
        run: python scripts/check_money_fields.py

      - name: Ambient-authority gate
        # TENANT-AUTH-00: the customer plane must not read User.roles to grant
        # platform authority. A Dinify administrator used to be defined by a role
        # string, and that predicate was wired as a cross-tenant bypass across the
        # portal — while account_type separately decided which plane an account
        # could log into. The predicates are gone; this keeps them gone.
        # PERMANENT (unlike the ratchet below, which self-terminates at zero):
        # there is no future state in which reintroducing this is acceptable.
        run: python scripts/check_ambient_authority.py

      - name: Tenant-relation ratchet
        # The committed tenant-relation baseline may only SHRINK — a new writable
        # relation must be classified, not baselined. Reads the baseline at the
        # comparison base via git (fetched at runtime by the script); fails closed
        # in CI if the base can't be read. On a PR the base is GITHUB_BASE_REF; on a
        # PUSH it is github.event.before (the pre-push commit), plumbed below — the
        # branch tip already contains the push and would hide an addition.
        # TEMPORARY: delete this step, the script, and the baseline file when the
        # baseline reaches zero (TENANT-STRUCT-00).
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/check_tenant_relation_ratchet.py

      - name: Guard qualification tests
        # D08 B2.3: the three guards above prove they can find what they claim to, and
        # that an incomplete scan is never clean. Each guard's CLI already runs its own
        # self-test before its scan; this suite drives those REAL CLIs against disposable
        # trees and real git repositories with a LOCAL bare origin (no network), executes
        # this file's own step text under the runner's shell, and runs verify.sh itself.
        # Offline, no database. Before the full suite so a broken guard fails early.
        run: python -m unittest discover -t . -s scripts -p "tests_*.py"

      - name: Dependency-audit evaluator tests
        # The evaluator's own regression matrix — offline and deterministic, fixtures
        # only, no database. Proves the policy can pass AND refuse; it scans nothing and
        # is not a substitute for the scan at the end of this job.
        run: python -m unittest discover -t . -s dependency_audit -p "tests_*.py"

      - name: Tenant-isolation closure gate
        # Fail-fast adversarial boundary suite (TENANT-ISO-PR6A): the focused
        # closure matrix + the deep capability / relationship / concurrency /
        # write-surface / delegated-session suites it builds on. Runs BEFORE the
        # full suite so a broken restaurant/diner tenant boundary — or a broken
        # delegated-administrator boundary — fails early with a clear signal.
        # Mirrors scripts/verify.sh; does NOT replace "Run tests" below.
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: test_dinify
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          python -m django test \
            dinify_backend.tenancy.tests_tenant_isolation_closure \
            dinify_backend.tenancy.tests_ambient_authority \
            restaurants_app.tests_diner_capability \
            restaurants_app.tests_menu_relationship_integrity \
            restaurants_app.tests_menu_relationships_concurrency \
            restaurants_app.tests_write_surface_tenancy \
            platform_admin_app.tests_delegated_session \
            --settings=dinify_backend.test_settings --verbosity=2 --timing

      - name: Run tests
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: test_dinify
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          python -m django test --settings=dinify_backend.test_settings --verbosity=2 --timing

      # DEPENDENCY AUDIT, part 2 of 2 — inside this leg, so the `test` aggregator below
      # cannot report success when it fails. Scans the snapshotted inventory (and the
      # hash-pinned scanner's own venv) against PyPI's advisory data and enforces the
      # policy: any advisory on a runtime package fails; an advisory on pip, whose
      # severity pip-audit does not report, cannot be evaluated and fails as incomplete;
      # a scan that could not complete — a timeout, a network failure, an unparseable or
      # empty report, a skipped package, an inventory that moved — is never read as
      # clean. Placed LAST so the suites above still report when only the audit fails.
      # No `if:`, no `continue-on-error`, no pipe: its exit status is the step's.
      - name: Dependency audit — scan the validated inventory and enforce the policy
        run: python -m dependency_audit self-test && python -m dependency_audit audit

      # The complete raw scanner output, the inventory and the decision, kept whether
      # the leg passed or not. `always()` only retains evidence; it cannot turn a failed
      # step green.
      - name: Retain the dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency_audit/evidence/
          if-no-files-found: warn
          retention-days: 30

  # Branch protection on `main` requires a status check literally named `test`.
  # A matrix job can never produce one: it always suffixes the leg value, so the
  # single leg above reports as `suite (3.12.3)` and the bare name would sit
  # "Expected — waiting for status to be reported" forever and no PR could merge.
  # Collapsing to one leg did NOT change that — the suffix comes from having a
  # matrix at all, not from having several — which is why the matrix construct
  # stays and this job is still needed.
  #
  # This aggregator owns that name and is the ONE required check. It goes green
  # only when EVERY leg succeeded — and since D08 B2.1 a leg includes the dependency
  # audit, so an audit that blocked or could not complete makes this red too, with no
  # change here. It is what decouples the required-check
  # list from the matrix: legs can be added, removed or re-pinned — as deleting
  # 3.10.12 at cutover was — with no repo-settings change.
  #
  # `if: always()` is load-bearing. Without it a failed leg would SKIP this job,
  # and a skipped required check never reports a failure — the merge would block
  # on a pending check instead of failing loudly.
  #
  # Do NOT rename this job or drop it, and do not add `continue-on-error`.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [suite]
    if: always()
    steps:
      - name: Require every Python matrix leg to have passed
        run: |
          echo "Matrix result: ${{ needs.suite.result }}"
          if [ "${{ needs.suite.result }}" != "success" ]; then
            echo "::error::One or more Python matrix legs did not succeed (${{ needs.suite.result }})." >&2
            exit 1
          fi
          echo "All Python matrix legs passed."
